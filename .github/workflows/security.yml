name: Segurança

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verificacoes-de-seguranca:
    name: Verificações de segurança
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar as ferramentas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Testar os scripts de segurança
        run: pytest -q

      - name: Rodar o pipeline de segurança
        run: python pipeline.py

      - name: Publicar os relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-seguranca
          path: reports/
          retention-days: 30