# A "lei" do pipeline. Os scripts Python leem daqui o que é aceitável.

versao: 1

escopo:
  # Pasta que o SAST (Bandit) vai analisar.
  pasta_do_codigo: app

  # Arquivo que o SCA (pip-audit) vai auditar.
  arquivo_de_dependencias: requirements.txt

  # Pastas que o scanner de segredos NÃO deve olhar.
  ignorar_caminhos:
    - .git
    - .venv
    - __pycache__
    - node_modules
    - reports

limites:
  segredos:
    ALTA: 0
    MEDIA: 2
    BAIXA: 5

  sast:
    ALTA: 0
    MEDIA: 3
    BAIXA: 10

  # O SCA conta quantidade, não gravidade: o pip-audit não devolve
  # severidade, então a política reflete o que a ferramenta entrega.
  sca:
    total: 5
    sem_correcao: 2